[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frappe-ai-agent"
version = "0.1.0"
description = "AI agent service for Frappe/ERPNext"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "anyio>=4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "starlette>=0.46",
    "langchain>=0.3",
    "langchain-core>=1",
    "langchain-ollama>=0.3",
    "langchain-mcp-adapters>=0.1",
    "structlog>=24.1",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48",
    "httpx>=0.27",
    "slowapi>=0.1.9",
    "limits>=5.8",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.3"]
anthropic = ["langchain-anthropic>=0.3"]
google = ["langchain-google-genai>=2.0"]

[dependency-groups]
# the three provider extras: tests/unit/test_integrations.py exercises each provider, and the image
# installs --no-dev, so they are testable here without reaching the shipped image (X11)
dev = [
    "langchain-openai>=0.3",
    "import-linter>=2.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "pyright>=1.1.409",
    "respx>=0.21",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF", "S110", "BLE001", "E722", "T20", "G", "ERA001", "TD003", "FIX002"]

[tool.pyright]
# Type-check both src and tests. Test-only patterns that pyright legitimately
# flags (private pydantic-settings kwargs, TypedDict variant access) are
# narrowed via cast/isinstance asserts or per-line `# pyright: ignore`.
pythonVersion = "3.12"
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires external services (Ollama, MCP, Frappe)",
]
filterwarnings = [
    # Upstream: langchain-mcp-adapters 0.2.2 still imports the deprecated
    # `streamablehttp_client` name from mcp.client.streamable_http. The
    # successor `streamable_http_client` is the same coroutine — nothing to
    # fix on our side. Remove once langchain-mcp-adapters releases >0.2.2.
    "ignore:Use `streamable_http_client` instead.:DeprecationWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent"]

[tool.deptry.package_module_name_map]
# The four OTEL distributions share one `opentelemetry` namespace package, which deptry
# cannot map back to a distribution name on its own.
opentelemetry-api = ["opentelemetry"]
opentelemetry-sdk = ["opentelemetry"]
opentelemetry-exporter-otlp-proto-grpc = ["opentelemetry"]
opentelemetry-instrumentation-fastapi = ["opentelemetry"]

[tool.deptry.per_rule_ignores]
# uvicorn is run as a command (Dockerfile, Makefile); the provider SDKs are loaded by name
# through langchain's init_chat_model (integrations/llm.py). Neither is imported here.
DEP002 = ["uvicorn", "langchain-openai", "langchain-anthropic", "langchain-google-genai"]
