repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # keep equal to the ruff in uv.lock: two versions disagree and CI fails where `make lint` passed
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      # the budget the repository holds itself to: radon ranks A 1-5, B 6-10, C 11-20, and xenon
      # fails the run when a block is worse than C or the average is worse than A
      - id: xenon
        name: complexity budget (xenon)
        entry: uvx --quiet xenon --max-absolute C --max-average A src
        language: system
        files: ^src/.*\.py$
        pass_filenames: false
